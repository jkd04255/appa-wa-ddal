name: G1-01 lockfile bootstrap
on:
  push:
    branches: [feat/g1-01-scaffold]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Record lockfile in feature branch
        if: github.ref == 'refs/heads/feat/g1-01-scaffold'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(g1-01): lock exact npm dependency graph"
            git push origin HEAD:feat/g1-01-scaffold
          fi
      - name: Clean install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke test root route
        run: npm run test:smoke
