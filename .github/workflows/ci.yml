name: G1 verified CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke test root HTTP route
        run: npm run test:smoke
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser role, responsive and accessibility QA
        run: npm run test:e2e
