name: G1 verified CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Vote database security
        run: npm run test:vote-security
      - name: Lint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke test root HTTP route
        run: npm run test:smoke
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser role, responsive and accessibility QA
        run: npm run test:e2e

      - name: Build static demonstration
        run: npm run build:demo
      - name: Static demonstration full browser regression
        run: npm run test:e2e:demo
      - name: Build account contract fixture
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_only
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "true"
        run: npm run build:demo
      - name: Account and vote API contract tests (intercepted, no live users)
        run: npm run test:auth
      - name: Build GitHub Pages demonstration
        env:
          NEXT_PUBLIC_BASE_PATH: /appa-wa-ddal
        run: npm run build:demo
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Keep visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-qa-${{ github.sha }}
          path: test-results/
          retention-days: 7
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/daughter-underground'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages demonstration
        id: deployment
        uses: actions/deploy-pages@v4
