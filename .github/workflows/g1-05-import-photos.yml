name: G1-05 one-time licensed editorial photo import
on:
  push:
    branches: [feat/g1-05-daughter-underground-home]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download only individually verified Unsplash License still-life photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/editorial
          download() {
            local image_path="$1"
            local output="$2"
            if [ -s "public/editorial/$output" ]; then return; fi
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 75 \
              "https://images.unsplash.com/$image_path?auto=format&fit=crop&fm=jpg&w=1000&q=78" \
              -o "public/editorial/$output"
            local mime
            mime=$(file --brief --mime-type "public/editorial/$output")
            if [ "$mime" != "image/jpeg" ]; then
              echo "Expected JPEG for $output, received $mime" >&2
              exit 1
            fi
            test "$(wc -c < "public/editorial/$output")" -gt 15000
            test "$(wc -c < "public/editorial/$output")" -lt 3500000
          }
          download "photo-1778854228024-c1aecd6859c5" "headphones-magazine.jpg"
          download "photo-1681679103943-cff212a6461a" "beauty-stilllife.jpg"
          download "photo-1773064990672-dfbe02865943" "cafe-dessert.jpg"
          download "photo-1759224357673-c7cb5ed009c4" "vinyl-night.jpg"
          file public/editorial/*.jpg
      - name: Commit self-hosted assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editorial/*.jpg
          if ! git diff --staged --quiet; then
            git commit -m "assets(g1-05): self-host licensed editorial still-life photographs"
            git push origin HEAD:feat/g1-05-daughter-underground-home
          fi
